<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Калькулятор секвенирования</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .form-group { margin: 1rem 0; }
    label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
    select, input { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    .result { background: #f0f7ff; padding: 1rem; border-radius: 6px; margin-top: 1.5rem; }
    .result h3 { margin-top: 0; }
    .hint { font-size: 0.85em; color: #666; margin-top: 0.2rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a2e; color: #eee; }
      .result { background: #16213e; }
      select, input { background: #0f3460; color: #eee; border: 1px solid #444; }
      .hint { color: #aaa; }
    }
  </style>
</head>
<body>
  <h1>🧬 Калькулятор секвенирования</h1>

  <div class="form-group">
    <label for="platform">Платформа</label>
    <select id="platform"></select>
  </div>

  <div class="form-group">
    <label for="instrument">Инструмент</label>
    <select id="instrument" disabled>
      <option value="">Сначала выберите платформу</option>
    </select>
  </div>

  <div class="form-group">
    <label for="flowcell">Flow Cell / Ячейка</label>
    <select id="flowcell" disabled>
      <option value="">Сначала выберите инструмент</option>
    </select>
  </div>

  <div class="form-group">
    <label for="cycles">Доступные циклы (пресет)</label>
    <select id="cycles" disabled>
      <option value="">Сначала выберите flow cell</option>
    </select>
  </div>

  <div class="form-group">
    <label for="mode">Режим секвенирования</label>
    <select id="mode">
      <option value="SE">Single End (SE)</option>
      <option value="PE" selected>Paired End (PE)</option>
    </select>
  </div>

  <div class="form-group" style="background:#eef2f7; padding:0.8rem; border-radius:6px;">
    <label style="font-size:0.9em; color:#555;">📏 Расчётная длина рида</label>
    <div id="readLengthDisplay" style="font-size:1.2em; font-weight:bold; margin-top:0.2rem;">— п.н.</div>
  </div>

  <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #ddd;">

  <div class="form-group">
    <label for="targetSizeGb">Размер целевой области на образец (Гб)</label>
    <input type="number" id="targetSizeGb" step="0.1" min="0.001" placeholder="Например: 3.2 для WGS человека"/>
    <div class="hint">💡 1 Мб = 0.001 Гб. Для WGS человека (~3.2 Гб) введите 3.2</div>
  </div>

  <div class="form-group">
    <label for="desiredCoverage">Желаемое среднее покрытие (X)</label>
    <input type="number" id="desiredCoverage" step="1" min="1" placeholder="Например: 30 для WGS, 100 для панелей"/>
  </div>

  <button id="calcBtn">Рассчитать</button>

  <div class="result" id="output" style="display:none">
    <h3>📊 Результаты</h3>
    <p><strong>Выход с ячейки:</strong> <span id="res-total-gb"></span> Гб</p>
    <p><strong>Длина рида:</strong> <span id="res-readlen"></span> п.н.</p>
    <p><strong>Данных на образец:</strong> <span id="res-gb-per-sample"></span> Гб (при покрытии <span id="res-coverage-input"></span>X)</p>
    <p style="font-size:1.3em; margin:1rem 0;"><strong>🎯 Макс. образцов на ячейку:</strong> <span id="res-samples" style="color:#2563eb;"></span></p>
    <p id="remaining-row"><strong>Остаток данных:</strong> <span id="res-remaining"></span> Гб</p>
    <p id="reverse-row" style="display:none; margin-top:1rem; padding-top:0.5rem; border-top:1px dashed #ccc;">
      <small>💡 Если запустить <strong id="res-custom-samples"></strong> образцов, покрытие составит ~<strong id="res-achieved-coverage"></strong>X</small>
    </p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
